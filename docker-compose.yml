services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: calculatrade
      POSTGRES_USER: calculatrade
      POSTGRES_PASSWORD: calculatrade
    ports:
      - "5432:5432"
    volumes:
      - calculatrade-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calculatrade -d calculatrade"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  calculatrade-postgres:
